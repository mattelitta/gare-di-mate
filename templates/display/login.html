{% extends "base.html" %}
{% block title %}Login — Display {{ comp.name }}{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16">
  <h1 class="text-2xl font-bold mb-6 text-center">{{ comp.name }}</h1>
  <div class="bg-white rounded-lg shadow p-6">
    <p class="text-gray-600 mb-4 text-sm">Questa gara è protetta da password.</p>
    {% if error %}<p class="text-red-600 text-sm mb-3">{{ error }}</p>{% endif %}
    <form method="post" class="space-y-3">
      <input name="password" type="password" placeholder="Password" autofocus
             class="w-full border rounded px-3 py-2">
      <button type="submit" class="w-full bg-orange-500 text-white py-2 rounded hover:bg-orange-600">Accedi</button>
    </form>
  </div>
</div>
{% endblock %}
