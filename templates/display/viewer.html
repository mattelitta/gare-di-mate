<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ disp.name }} — {{ comp.name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; }
    .bar-fill { transition: width 0.8s ease; }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .reveal-anim { animation: fadeSlideIn 0.5s ease both; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

<!-- Header fisso -->
<header class="flex items-center justify-between px-6 py-2 bg-slate-800 border-b border-slate-700 shrink-0">
  <div class="flex items-center gap-4">
    <span class="font-bold text-xl" id="hdr-name">{{ comp.name }}</span>
    <span class="text-slate-400 text-sm" id="hdr-date">{{ comp.date }}</span>
    <span id="hdr-status" class="text-xs px-2 py-0.5 rounded bg-slate-700 text-slate-300"></span>
  </div>
  <span id="hdr-timer" class="font-mono text-4xl font-bold text-white tabular-nums"></span>
</header>

<!-- Contenuto principale -->
<main class="flex-1 overflow-hidden" id="main-content">
  <div class="flex items-center justify-center h-full text-slate-500">Caricamento...</div>
</main>

<script>
const COMP_ID = {{ comp.id }};
const DISPLAY_ID = {{ disp.id }};
const API_URL = `/display/api/${COMP_ID}/schermo/${DISPLAY_ID}/stato`;
let lastView = null;
let state = null;
let lastRevealedPositions = 0;

function fmtTime(secs) {
  if (secs == null || secs < 0) secs = 0;
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function statusLabel(s) {
  return {running:'In corso', paused:'In pausa', ended:'Terminata', created:'Non iniziata'}[s] || s;
}

async function fetchState() {
  try {
    const r = await fetch(API_URL);
    if (!r.ok) return;
    state = await r.json();
    updateHeader();
    if (state.view !== lastView) {
      lastView = state.view;
      render();
    } else {
      renderInPlace();
    }
  } catch(e) {}
}

function updateHeader() {
  document.getElementById('hdr-name').textContent = state.comp_name;
  document.getElementById('hdr-date').textContent = state.comp_date;
  document.getElementById('hdr-status').textContent = statusLabel(state.status);
  const rem = Math.max(0, state.remaining_seconds);
  const urgent = rem < 300 && state.status === 'running';
  document.getElementById('hdr-timer').textContent = fmtTime(rem);
  document.getElementById('hdr-timer').className =
    'font-mono text-4xl font-bold tabular-nums ' + (urgent ? 'text-red-400' : 'text-white');
}

function render() {
  const main = document.getElementById('main-content');
  switch(state.view) {
    case 'test':              main.innerHTML = renderTest(); break;
    case 'ranking':           main.innerHTML = renderRanking(); break;
    case 'team_list':         main.innerHTML = renderTeamList(); break;
    case 'problem_values':    main.innerHTML = renderProblemValues(); break;
    case 'competition_status':main.innerHTML = renderCompStatus(); break;
    case 'final_ranking':     main.innerHTML = renderFinalRanking(); break;
    default: main.innerHTML = `<div class="flex items-center justify-center h-full text-slate-500">Vista: ${state.view}</div>`;
  }
}

function renderInPlace() {
  switch(state.view) {
    case 'ranking':           document.getElementById('main-content').innerHTML = renderRanking(); break;
    case 'team_list':         document.getElementById('main-content').innerHTML = renderTeamList(); break;
    case 'problem_values':    document.getElementById('main-content').innerHTML = renderProblemValues(); break;
    case 'competition_status':document.getElementById('main-content').innerHTML = renderCompStatus(); break;
    case 'final_ranking':     document.getElementById('main-content').innerHTML = renderFinalRanking(); break;
  }
}

// --- TEST ---
function renderTest() {
  return `<div class="flex flex-col items-center justify-center h-full gap-6">
    <div class="text-6xl font-bold text-slate-300">{{ disp.name }}</div>
    <div class="font-mono text-2xl text-slate-500">${location.hostname}</div>
  </div>`;
}

// --- Preset di scala (1=minima … 5=massima) ---
const SCALES = {
  1: { rankW:'1.8rem', nameW:'6rem',  scoreW:'2.2rem', rankFs:'0.75rem', nameFs:'0.65rem', subFs:'0.55rem', barH:'0.8rem',  gap:'0.08rem', titleFs:'0.85rem', cellFs:'0.6rem',  cellMinW:'36px', cellPy:'0.08rem' },
  2: { rankW:'2.3rem', nameW:'8rem',  scoreW:'2.8rem', rankFs:'0.95rem', nameFs:'0.82rem', subFs:'0.65rem', barH:'1.2rem',  gap:'0.15rem', titleFs:'1rem',    cellFs:'0.7rem',  cellMinW:'46px', cellPy:'0.12rem' },
  3: { rankW:'3rem',   nameW:'12rem', scoreW:'4rem',   rankFs:'1.25rem', nameFs:'1rem',    subFs:'0.75rem', barH:'2rem',    gap:'0.2rem',  titleFs:'1.1rem',  cellFs:'0.85rem', cellMinW:'56px', cellPy:'0.2rem'  },
  4: { rankW:'3.5rem', nameW:'14rem', scoreW:'4.5rem', rankFs:'1.6rem',  nameFs:'1.2rem',  subFs:'0.9rem',  barH:'2.5rem',  gap:'0.35rem', titleFs:'1.3rem',  cellFs:'1rem',    cellMinW:'66px', cellPy:'0.3rem'  },
  5: { rankW:'4.5rem', nameW:'17rem', scoreW:'5.5rem', rankFs:'2rem',    nameFs:'1.4rem',  subFs:'1rem',    barH:'3rem',    gap:'0.5rem',  titleFs:'1.5rem',  cellFs:'1.15rem', cellMinW:'78px', cellPy:'0.4rem'  },
};
function sc() { return SCALES[state && state.text_scale ? state.text_scale : 3]; }

// --- Helper: riga compatta con punteggio a sinistra e barra a destra ---
function rigaBarra({ label, sublabel, rank, barColor, pct, value, valueColor, separator }) {
  const s = sc();
  const rowStyle = `display:flex;align-items:center;gap:${s.gap}`;
  return `
    ${separator ? `
      <div style="${rowStyle};margin:0.25rem 0">
        <div style="width:${s.rankW};flex-shrink:0"></div>
        <div style="flex:1;border-top:4px solid #ef4444;opacity:0.8"></div>
      </div>` : ''}
    <div style="${rowStyle}">
      <span style="width:${s.rankW};flex-shrink:0;text-align:right;font-family:monospace;font-size:${s.rankFs};font-weight:bold;color:#cbd5e1">${rank}</span>
      <div style="width:${s.nameW};flex-shrink:0;line-height:1.2">
        <span style="font-weight:600;font-size:${s.nameFs}" class="${label.color}">${label.text}</span>
        <span style="color:#64748b;font-size:${s.subFs};margin-left:0.25rem">${sublabel}</span>
      </div>
      <span style="width:${s.scoreW};flex-shrink:0;text-align:right;font-family:monospace;font-weight:bold;font-size:${s.rankFs}" class="${valueColor}">${value}</span>
      <div style="flex:1;border-radius:0.25rem;overflow:hidden;background:#334155;height:${s.barH}">
        <div class="${barColor} bar-fill" style="width:${pct}%;height:100%;border-radius:0.25rem"></div>
      </div>
    </div>`;
}

// --- RANKING ---
function renderRanking() {
  if (state.blackout_active && state.status !== 'ended') {
    const rem = Math.max(0, state.remaining_seconds);
    return `<div class="flex items-center justify-center h-full">
      <div class="text-center">
        <div class="text-8xl mb-6">🔒</div>
        <div class="text-3xl text-slate-300 font-semibold mb-3">Classifica oscurata</div>
        <div class="text-slate-500 text-lg">La classifica sarà visibile al termine della gara</div>
        <div class="font-mono text-4xl font-bold text-slate-400 mt-4">${fmtTime(rem)}</div>
      </div>
    </div>`;
  }
  const teams = state.teams;
  const maxScore = Math.max(...teams.map(t => t.total), 1);
  const nq = state.num_qualified;
  const s = sc();
  let html = `<div class="h-full overflow-y-auto px-4 py-3">
    <h2 style="font-size:${s.titleFs}" class="font-bold mb-2 text-slate-200">Classifica</h2>
    <div style="display:flex;flex-direction:column;gap:${s.gap}">`;
  teams.forEach((t, i) => {
    const isGuest = t.is_guest;
    const pct = Math.max(2, (t.total / maxScore) * 100);
    const showLine = !isGuest && nq > 0 && i === nq - 1 && i < teams.length - 1;
    const barColor = isGuest ? 'bg-orange-500' : 'bg-blue-500';
    const guestTag = isGuest ? ' <span style="font-size:0.65rem;color:#fb923c">ospite</span>' : '';
    html += rigaBarra({
      label: { text: t.name + guestTag, color: isGuest ? 'text-orange-300' : 'text-slate-200' },
      sublabel: t.city,
      rank: isGuest ? '—' : i + 1,
      barColor, pct,
      value: Math.round(t.total),
      valueColor: 'text-slate-100',
      separator: showLine,
    });
  });
  html += `</div></div>`;
  return html;
}

// --- TEAM LIST ---
function renderTeamList() {
  const teams = [...state.teams].sort((a, b) => a.number - b.number);
  const maxScore = Math.max(...teams.map(t => t.total), 1);
  const s = sc();
  let html = `<div class="h-full overflow-y-auto px-4 py-3">
    <h2 style="font-size:${s.titleFs}" class="font-bold mb-2 text-slate-200">Elenco squadre</h2>
    <div style="display:flex;flex-direction:column;gap:${s.gap}">`;
  teams.forEach(t => {
    const pct = Math.max(2, (t.total / maxScore) * 100);
    const barColor = t.is_guest ? 'bg-orange-500' : 'bg-blue-500';
    html += rigaBarra({
      label: { text: t.name, color: t.is_guest ? 'text-orange-300' : 'text-slate-200' },
      sublabel: t.city,
      rank: String(t.number).padStart(2, '0'),
      barColor, pct,
      value: Math.round(t.total),
      valueColor: 'text-slate-100',
      separator: false,
    });
  });
  html += `</div></div>`;
  return html;
}

// --- PROBLEM VALUES ---
function renderProblemValues() {
  const probs = state.problems;
  const maxVal = Math.max(...probs.map(p => p.value), 1);
  const s = sc();
  let html = `<div class="h-full overflow-y-auto px-4 py-3">
    <h2 style="font-size:${s.titleFs}" class="font-bold mb-2 text-slate-200">Valori dei problemi</h2>
    <div style="display:flex;flex-direction:column;gap:${s.gap}">`;
  probs.forEach(p => {
    const pct = Math.max(2, (p.value / maxVal) * 100);
    html += rigaBarra({
      label: { text: p.name, color: 'text-slate-200' },
      sublabel: '',
      rank: String(p.number).padStart(2, '0'),
      barColor: 'bg-yellow-500',
      pct,
      value: Math.round(p.value),
      valueColor: 'text-yellow-300',
      separator: false,
    });
  });
  html += `</div></div>`;
  return html;
}

// --- COMPETITION STATUS ---
function renderCompStatus() {
  const teams = [...state.teams].sort((a,b) => a.number - b.number);
  const probs = state.problems;
  const n = state.n;
  const s = sc();

  const cellBg = {
    empty:   ['bg-slate-700', 'bg-slate-600'],
    error:   ['bg-red-900',   'bg-red-800'],
    correct: ['bg-green-900', 'bg-green-800'],
  };

  let html = `<div class="h-full overflow-auto p-4">
    <h2 style="font-size:${s.titleFs}" class="font-bold text-slate-200 mb-2">Stato gara</h2>
    <table class="w-full border-collapse">
      <thead>
        <tr class="text-slate-400">
          <th class="text-left pr-3 font-medium sticky left-0 bg-slate-900"
              style="font-size:${s.subFs};padding-top:${s.cellPy};padding-bottom:${s.cellPy}">Squadra</th>`;
  probs.forEach(p => {
    html += `<th class="text-center font-medium" style="min-width:${s.cellMinW};padding:${s.cellPy} 2px">
      <div style="font-size:${s.subFs}" class="font-bold text-slate-300">${String(p.number).padStart(2,'0')}</div>
      <div style="font-size:${s.nameFs}" class="text-yellow-400 font-mono font-bold">${Math.round(p.value)}</div>
    </th>`;
  });
  html += `</tr></thead><tbody>`;

  teams.forEach((t, ri) => {
    const tone = ri % 2;
    const rowBg = tone === 0 ? 'bg-slate-800' : 'bg-slate-700';
    const teamColor = t.is_guest ? 'text-orange-300' : 'text-slate-200';
    html += `<tr class="${rowBg}">
      <td class="pr-3 font-semibold ${teamColor} whitespace-nowrap sticky left-0 ${rowBg}"
          style="padding-top:${s.cellPy};padding-bottom:${s.cellPy}">
        <span class="font-mono text-slate-400 mr-1" style="font-size:${s.subFs}">${String(t.number).padStart(2,'0')}</span>
        <span style="font-size:${s.nameFs}">${t.name}</span>
        <span class="text-slate-500 font-normal ml-1" style="font-size:${s.subFs}">${t.city}</span>
      </td>`;
    probs.forEach(p => {
      const solved = t.problem_solved[p.id];
      const errors = t.problem_errors[p.id] || 0;
      const contrib = t.problem_contributions[p.id] || 0;
      const isJolly = t.jolly_problem_id === p.id;
      let bg, textColor;
      if (solved)        { bg = cellBg.correct[tone]; textColor = 'text-green-300'; }
      else if (errors>0) { bg = cellBg.error[tone];   textColor = 'text-red-300'; }
      else               { bg = cellBg.empty[tone];   textColor = ''; }
      const text = (errors > 0 || solved) ? (contrib > 0 ? '+'+Math.round(contrib) : Math.round(contrib)) : '';
      html += `<td class="text-center" style="padding:${s.cellPy} 2px">
        <div class="${bg} rounded ${isJolly ? 'ring-2 ring-yellow-400' : ''} flex items-center justify-center"
             style="min-height:calc(${s.cellFs} * 2.2);padding:2px 4px">
          <span class="font-mono font-bold ${textColor}" style="font-size:${s.cellFs}">${text}</span>
        </div>
      </td>`;
    });
    html += `</tr>`;
  });

  html += `</tbody><tfoot><tr>
    <td class="pr-3 text-slate-400 font-medium sticky left-0 bg-slate-900"
        style="font-size:${s.subFs};padding-top:${s.cellPy};padding-bottom:${s.cellPy}">
      Risolutori <span class="font-mono text-slate-500 ml-1">(n=${n})</span>
    </td>`;
  probs.forEach(p => {
    const count = Math.min(p.num_solvers, n);
    let bg = 'bg-slate-700 text-slate-400';
    if (count >= n) bg = 'bg-red-800 text-red-200';
    else if (count >= 1) bg = 'bg-yellow-800 text-yellow-200';
    html += `<td class="text-center" style="padding:${s.cellPy} 2px">
      <span class="font-mono font-bold px-1 rounded ${bg}" style="font-size:${s.cellFs}">${count}</span>
    </td>`;
  });
  html += `</tr></tfoot></table></div>`;
  return html;
}

// --- FINAL RANKING ---
function renderFinalRanking() {
  if (!state.final_locked) {
    return `<div class="flex items-center justify-center h-full text-slate-500 text-xl">
      Classifica finale non ancora disponibile.
    </div>`;
  }
  const teams = state.teams;
  const nonGuests = teams.filter(t => !t.is_guest);
  const revealed = state.revealed_positions;
  const total = nonGuests.length;
  const nq = state.num_qualified;
  const revealedFrom = total - revealed;

  // Traccia la posizione appena rivelata per animarla
  const justRevealedIdx = (revealed > lastRevealedPositions) ? revealedFrom : -1;
  lastRevealedPositions = revealed;

  let html = `<div class="h-full overflow-y-auto px-8 py-6">
    <h2 class="text-3xl font-bold mb-6 text-center text-slate-200">🏆 Classifica Finale</h2>
    <div class="space-y-3 max-w-3xl mx-auto">`;

  for (let i = 0; i < total; i++) {
    const t = nonGuests[i];
    const pos = i + 1;
    const isJustRevealed = (i === justRevealedIdx);

    if (i < revealedFrom) {
      // Placeholder non ancora rivelato
      html += `<div class="flex items-center gap-4 bg-slate-800 rounded-xl px-6 py-4 opacity-30">
        <span class="text-4xl font-bold text-slate-500 w-12 text-right">${pos}</span>
        <div class="flex-1 h-8 bg-slate-700 rounded"></div>
      </div>`;
    } else {
      const isQualified = nq > 0 && pos <= nq;
      // Spazio visivo tra l'ultima qualificata e la prima non-qualificata
      const gapBefore = (nq > 0 && !isQualified && pos === nq + 1 && i >= revealedFrom) ? 'mt-6' : '';
      const border = isQualified ? 'border-l-4 border-yellow-400' : '';
      const animClass = isJustRevealed ? 'reveal-anim' : '';
      html += `<div class="flex items-center gap-4 bg-slate-700 rounded-xl px-6 py-4 ${border} ${gapBefore} ${animClass}">
        <span class="text-4xl font-bold ${pos <= 3 ? 'text-yellow-400' : 'text-slate-300'} w-12 text-right">${pos}</span>
        <div class="flex-1">
          <div class="font-bold text-xl text-slate-100">${t.name}</div>
          <div class="text-slate-400 text-sm">${t.city}</div>
        </div>
        <span class="font-mono text-2xl font-bold text-slate-200">${Math.round(t.total)}</span>
        ${isQualified ? '<span class="text-yellow-400 text-sm font-semibold ml-2">✓ qualif.</span>' : ''}
      </div>`;
    }
  }

  // Ospiti in fondo
  const guests = teams.filter(t => t.is_guest);
  if (guests.length > 0 && revealed > 0) {
    html += `<div class="border-t border-slate-600 my-4"></div>`;
    guests.forEach(t => {
      html += `<div class="flex items-center gap-4 bg-slate-800 rounded-xl px-6 py-3 opacity-60">
        <span class="text-2xl font-bold text-orange-400 w-12 text-right">—</span>
        <div class="flex-1">
          <div class="font-semibold text-orange-300">${t.name} <span class="text-orange-500 text-xs">ospite</span></div>
          <div class="text-slate-400 text-sm">${t.city}</div>
        </div>
        <span class="font-mono text-xl font-bold text-slate-400">${Math.round(t.total)}</span>
      </div>`;
    });
  }

  html += `</div></div>`;
  return html;
}

// Poll ogni 1.5s
fetchState();
setInterval(fetchState, 1500);
</script>
</body>
</html>
